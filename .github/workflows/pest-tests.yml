name: Pest Tests

on:
  workflow_dispatch:
  push:
    paths:
      - '**.php'
      - 'composer.lock'
      - 'composer.json'
      - 'tests/fixture/**'
      - '.agents/**'
      - '.github/workflows/pest-tests.yml'
  pull_request:
    paths:
      - '**.php'
      - 'composer.lock'
      - 'composer.json'
      - 'tests/fixture/**'
      - '.agents/**'
      - '.github/workflows/pest-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['8.3', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          tools: composer:v2
          coverage: xdebug

      - name: Cache composer dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: composer-${{ matrix.php }}-${{ hashFiles('composer.lock') }}

      - name: Install
        run: composer install

      - name: CMS
        run: composer cms:starterkit

      - name: Test code
        run: composer test -- --ci
